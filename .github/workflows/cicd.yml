name: CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify repository
        run: echo "Repository checkout successful"
      - name: Verify Django
        run: python3 --version
      - name: Verify Node.js
        run: node --version
      - name: CI/CD success
        run: echo "CI/CD workflow completed successfully"

  lint_python_files:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Python linter
        run: python -m pip install flake8
      - name: Linter
        run: flake8 server/djangoapp --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Post
        run: echo "Python linting completed"
      - name: Completion
        run: echo "Lint Python Files completed successfully"

  lint_javascript_files:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install JavaScript dependencies
        working-directory: server/frontend
        run: npm install
      - name: Linter
        working-directory: server/frontend
        run: npm run build
      - name: Post
        run: echo "JavaScript linting completed"
      - name: Completion
        run: echo "Lint JavaScript Files completed successfully"
