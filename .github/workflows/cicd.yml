name: CI/CD
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify repository
        run: echo "Repository checkout successful"
      - name: Verify Django
        run: python3 --version
      - name: Verify Node.js
        run: node --version
      - name: CI/CD success
        run: echo "CI/CD workflow completed successfully"
